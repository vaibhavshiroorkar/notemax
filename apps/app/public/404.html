<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found - Notemax</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="stylesheet" href="/legal.css" />
    <!--
      Cloudflare Pages answers a missing path with this page and status 404.
      Without it, Pages answers with index.html and status 200, and on
      notemax.shiroorkar.com the zone's cache once kept that page under a
      missing /assets/ file name, which the assets rule in _headers marks
      immutable for a year. The app needs no other paths: it only opens at /
      and keeps its place after the #.
    -->
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>Nothing lives at this address. <a href="/">Go to Notemax</a>.</p>
    </main>
  </body>
</html>
